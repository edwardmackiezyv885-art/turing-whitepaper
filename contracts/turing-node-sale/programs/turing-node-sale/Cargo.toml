[package]
name = "turing-node-sale"
version = "0.1.0"
description = "Turing mainnet node sale with Pyth pricing and wallet-bound TNODE certificates"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "turing_node_sale"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.31.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.31.1", features = ["associated_token", "token_2022", "token_2022_extensions"] }
pyth-solana-receiver-sdk = "=1.0.0"
